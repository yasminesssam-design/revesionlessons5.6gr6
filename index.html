<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة السحابة – MOHTARF</title>
<style>
:root{--navy:#14324f;--sky:#2ec4f1;--sun:#ffd23f;--coral:#ff5d6c;--mint:#2fd18b;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--navy);background:linear-gradient(#7fdcff,#d9f6ff 60%,#fff6d6);overflow-x:hidden;padding:12px}
.cloud{position:fixed;font-size:70px;opacity:.75;animation:drift linear infinite;z-index:0;pointer-events:none}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto}
.logo{display:flex;justify-content:center;align-items:center;gap:10px;font-weight:900;font-size:22px;margin:4px 0 10px}
.logo b{background:var(--navy);color:var(--sun);padding:4px 14px;border-radius:12px;letter-spacing:2px}
.card{background:var(--white);border:4px solid var(--navy);border-radius:26px;padding:20px;box-shadow:0 8px 0 var(--navy)}
h1{font-size:34px;text-align:center;line-height:1.4}
.hero{font-size:84px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
input{width:100%;font:inherit;font-size:26px;padding:12px;border:4px solid var(--sky);border-radius:16px;text-align:center;margin:14px 0}
.btn{display:block;width:100%;font:inherit;font-size:26px;font-weight:800;padding:14px;border:4px solid var(--navy);border-radius:18px;background:var(--sun);color:var(--navy);cursor:pointer;box-shadow:0 6px 0 var(--navy);transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:20px;font-weight:800;margin-bottom:10px;flex-wrap:wrap}
.pill{background:var(--navy);color:var(--white);padding:6px 14px;border-radius:30px}
.track{position:relative;height:26px;background:#e3f6ff;border:3px solid var(--navy);border-radius:20px;margin-bottom:14px}
.fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:16px;width:0;transition:width .6s}
.rocket{position:absolute;top:-18px;font-size:34px;transition:right .6s;transform:scaleX(-1)}
.tag{display:inline-block;background:var(--sky);color:var(--navy);font-weight:800;padding:4px 12px;border-radius:20px;font-size:16px}
.q{font-size:28px;font-weight:800;line-height:1.7;margin:12px 0}
.opt{display:block;width:100%;text-align:right;font:inherit;font-size:24px;font-weight:700;padding:14px 16px;margin:10px 0;border:4px solid var(--sky);border-radius:18px;background:#f4fcff;color:var(--navy);cursor:pointer;transition:transform .12s}
.opt:hover:not(:disabled){transform:scale(1.02)}
.opt.ok{background:var(--mint);border-color:#0f9b60;animation:pop .5s}
.opt.no{background:var(--coral);border-color:#c23645;animation:shake .5s}
.opt.show{background:#c9f7e1;border-color:#0f9b60}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.msg{font-size:26px;font-weight:900;text-align:center;min-height:40px;margin-top:6px}
.next{display:none;margin-top:10px}
.big{font-size:60px;text-align:center}
.score{font-size:44px;font-weight:900;text-align:center;color:var(--coral)}
.conf{position:fixed;top:-20px;font-size:28px;z-index:9;pointer-events:none;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{font-size:20px}
@media(prefers-reduced-motion:reduce){.cloud,.hero{animation:none}}
</style>
</head>
<body>
<main>
<div class="logo"><b>MOHTARF</b> محترف · المحتوى العلمي</div>
<div class="card" id="app"></div>
</main>
<script>
const TF=["✓ صح","✗ خطأ"];
// [نوع, السؤال, الاختيارات, رقم الإجابة الصحيحة, الدرس]
const Q=[
["tf","تخزين الملفات في \"السحابة\" يجعلها أكثر عرضة للضياع في حال تعطُّل جهازك.",TF,1,5],
["tf","يمكنك الوصول إلى ملفاتك المخزنة في \"السحابة\" حتى إذا لم يكن لديك اتصال بالإنترنت.",TF,1,5],
["tf","تساعدك الحوسبة السحابية على توفير مساحة تخزين كبيرة على جهازك.",TF,0,5],
["tf","الذكاء الاصطناعي هو أحد مزودي خدمة الحوسبة السحابية.",TF,1,5],
["mc","ما التعريف الأفضل للحوسبة السحابية؟",["برنامج لتعديل الصور","طريقة لتخزين الملفات على الإنترنت","طريقة لتصوير الأفلام","نظام لتشغيل الألعاب"],1,5],
["mc","عندما تستخدم الحوسبة السحابية، أين تخزن ملفاتك؟",["على قرص صلب خارجي","على الهاتف فقط","في الخوادم عبر الإنترنت","على جهاز الكمبيوتر فقط"],2,5],
["mc","أيٌّ من التالي يُعد مثالًا على مزود خدمة الحوسبة السحابية؟",["واتساب WhatsApp","فيسبوك Facebook","جوجل درايف Google Drive","يوتيوب YouTube"],2,5],
["mc","إحدى سلبيات استخدام الحوسبة السحابية:",["سهولة مشاركة الملفات","توفير المساحة على الجهاز","الأمان الكامل للملفات","الحاجة إلى اتصال بالإنترنت"],3,5],
["mc","ماذا تحتاج للوصول إلى ملفاتك المخزنة على السحابة؟",["طابعة","اتصال بالإنترنت","كاميرا","ماسح ضوئي"],1,5],
["mc","الحوسبة السحابية تتيح تخزين البيانات والوصول إليها من خلال ..... عبر الإنترنت.",["الخوادم","الذكاء الاصطناعي","مكافحة الفيروسات","المصادقة متعددة العوامل"],0,5],
["tf","تُعتبر خدمة \"واتساب\" من أمثلة تطبيقات الحوسبة السحابية.",TF,0,6],
["tf","أفضل طريقة لحفظ الملفات هي استخدام التخزين التقليدي فقط.",TF,1,6],
["tf","يجب أن يكون لديك اتصال بالإنترنت لرفع ملف على OneDrive.",TF,0,6],
["tf","لا يمكنك رفع الفيديوهات على OneDrive.",TF,1,6],
["mc","ما الزر الذي يجب أن تضغط عليه لرفع ملف على OneDrive؟",["إغلاق Close","بحث Search","رفع Upload","حذف Delete"],2,6],
["mc","ماذا يحدث لملفاتك المحفوظة على OneDrive إذا تعطل جهازك؟",["تفقدها للأبد","يتم حذفها من السحابة","تنتقل تلقائيًا إلى جهاز آخر","تبقى آمنة في السحابة"],3,6],
["mc","ما الفائدة الرئيسية من دمج التخزين السحابي مع التقليدي؟",["الاستفادة من سرعة التخزين المحلي وأمان التخزين السحابي","تقليل تكلفة استخدام الإنترنت","تشغيل الألعاب بشكل أسرع","زيادة عدد الأصدقاء على الإنترنت"],0,6],
["mc","Microsoft 365 هو .....",["جهاز","برنامج يحتوي على تطبيقات","لعبة","موقع ترفيهي"],1,6],
["mc","يساعدك ..... على الوصول إلى ملفاتك من أي مكان.",["Word","PowerPoint","Excel","OneDrive"],3,6],
["mc","التخزين السحابي يشبه .....",["جهاز الكمبيوتر","مخزنًا كبيرًا بعيدًا","الهاتف","الطابعة"],1,6]
];
const $=document.getElementById("app");
let name="",i=0,score=0,streak=0,right=0,best=0,locked=false;
// المؤثرات الصوتية
let AC;
function tone(f,d,t="sine",s=0,v=.25){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+s);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+s+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+s);o.stop(AC.currentTime+s+d)}catch(e){}}
const sfx={
ok(){[523,659,784,1047].forEach((f,k)=>tone(f,.18,"triangle",k*.09))},
no(){tone(220,.25,"sawtooth",0,.2);tone(150,.35,"sawtooth",.15,.2)},
click(){tone(660,.07,"square",0,.1)},
win(){[523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,.22,"triangle",k*.12))}
};
function confetti(n=40){const e=["🎉","⭐","☁️","✨","🎈","💎"];for(let k=0;k<n;k++){const s=document.createElement("span");s.className="conf";s.textContent=e[k%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}}
// خلفية السحب
for(let k=0;k<6;k++){const c=document.createElement("div");c.className="cloud";c.textContent="☁️";c.style.top=(5+k*15)+"vh";c.style.fontSize=(50+k*12)+"px";c.style.animationDuration=(30+k*9)+"s";c.style.animationDelay=(-k*8)+"s";document.body.prepend(c)}

function home(){
$.innerHTML=`<div class="hero">☁️🚀</div><h1>لعبة السحابة</h1>
<p style="text-align:center;font-size:22px;margin-top:6px">الحوسبة السحابية وتطبيقات التخزين السحابي<br>الصف السادس الابتدائي</p>
<input id="nm" placeholder="اكتب اسمك هنا" maxlength="30" autocomplete="off">
<button class="btn" id="go">🎮 ابدأ اللعب</button>`;
document.getElementById("go").onclick=()=>{const v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").focus();sfx.no();return}name=v;i=score=streak=right=best=0;sfx.click();show()}
}
function show(){
locked=false;const q=Q[i];
$.innerHTML=`<div class="hud"><span class="pill">👤 ${name}</span><span class="pill">⭐ ${score}</span><span class="pill">🔥 ${streak}</span></div>
<div class="track"><div class="fill" style="width:${i/Q.length*100}%"></div><div class="rocket" style="right:calc(${i/Q.length*100}% - 6px)">🚀</div></div>
<span class="tag">السؤال ${i+1} من ${Q.length} · الدرس ${q[4]==5?"الخامس":"السادس"}</span>
<div class="q">${q[1]}</div><div id="ops"></div><div class="msg" id="msg"></div>
<button class="btn next" id="nx">${i==Q.length-1?"🏆 شاهد نتيجتك":"التالي ⬅️"}</button>`;
q[2].forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k,b);document.getElementById("ops").appendChild(b)});
document.getElementById("nx").onclick=()=>{sfx.click();i++;i<Q.length?show():end()}
}
function pick(k,b){
if(locked)return;locked=true;const q=Q[i],all=[...document.querySelectorAll(".opt")],m=document.getElementById("msg");
all.forEach(x=>x.disabled=true);
if(k==q[3]){streak++;best=Math.max(best,streak);right++;const p=10+Math.min(streak-1,5)*2;score+=p;b.classList.add("ok");sfx.ok();confetti(18);
m.style.color="#0f9b60";m.textContent=(streak>=3?"🔥 سلسلة "+streak+"! ":"👏 أحسنت! ")+"+"+p+" نقطة"}
else{streak=0;b.classList.add("no");all[q[3]].classList.add("show");sfx.no();m.style.color="#c23645";m.textContent="💡 الإجابة الصحيحة باللون الأخضر"}
document.querySelector(".pills,.hud").children[1].textContent="⭐ "+score;document.querySelector(".hud").children[2].textContent="🔥 "+streak;
document.getElementById("nx").style.display="block";
}
function end(){
const r=right>=18?["💎","بطل ألماسي"]:right>=14?["🥇","نجم ذهبي"]:right>=10?["🥈","مبدع فضي"]:["🥉","مبتدئ شاطر"];
sfx.win();confetti(70);
const txt=`🎮 نتيجة لعبة السحابة – MOHTARF\nالاسم: ${name}\nالإجابات الصحيحة: ${right} من ${Q.length}\nالنقاط: ${score}\nأطول سلسلة: ${best}\nالمستوى: ${r[1]}`;
$.innerHTML=`<div class="big">${r[0]}</div><h1>${name}، أنت ${r[1]}!</h1>
<div class="score">⭐ ${score} نقطة</div>
<p style="text-align:center;font-size:26px;font-weight:800;margin:8px 0">✅ ${right} صحيحة من ${Q.length} &nbsp;·&nbsp; 🔥 أطول سلسلة ${best}</p>
<div class="row"><a class="btn" style="text-decoration:none;text-align:center;background:var(--mint)" target="_blank" rel="noopener" href="https://wa.me/201099920517?text=${encodeURIComponent(txt)}">📲 أرسل النتيجة</a><button class="btn" id="re">🔄 العب مرة أخرى</button></div>`;
document.getElementById("re").onclick=()=>{sfx.click();home()};
}
home();
</script>
</body>
</html>
